<html>
<head>
    <title>Pose-Based 2048</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <button type="button" id="startbtn" onclick="init()">Start</button>
    <div><canvas id="canvas"></canvas></div>
    <h1 id="bestGuess"></h1>

    <div class="container">
        <div class="info">
            <h1>2048</h1>
            <div class="score-container">
                <p class="score-title">score</p>
                <h2 id="score">0</h2>
            </div>
        </div>
        <p id="result">Join the numbers and get to the <b>2048</b> tile!</p>
        <div class="grid"></div>
        <div class="progbarbg">
            <div id="progbar" value="0"></div>
        </div>
    </div>
</body>
</html>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
<script src="./script.js" async="true"></script>
